# 기본 설정. 실험별로 다른 값을 쓰고 싶으면 configs/exp/*.yaml 에
# 이 파일과 같은 키 구조로 "덮어쓸 값만" 적어서 --config configs/exp/xxx.yaml 로 사용한다.

data:
  source: "20newsgroups"   # sklearn.datasets.fetch_20newsgroups(subset="all", remove=("headers","footers","quotes"))
  test_ratio: 0.2
  seed: 42

preprocessing:
  lowercase: true
  remove_special_chars: true
  remove_stopwords: true
  min_token_len: 1
  max_len: 280          # 훈련 데이터 토큰 길이 95분위수 기준 (EDA로 확인)

embedding:
  method: "word2vec"    # word2vec | fasttext | glove
  embedding_dim: 100
  window: 5
  min_count: 1
  freeze: false         # 임베딩 레이어를 학습 중 고정할지 여부
  glove_path: null      # method: glove 일 때 사전학습 벡터 파일 경로

model:
  type: "lstm"          # lstm | gru
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.5

train:
  batch_size: 64
  lr: 0.005
  epochs: 10
  seed: 42
