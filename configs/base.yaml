# 기본 설정. 실험별로 다른 값을 쓰고 싶으면 configs/exp/*.yaml 에
# 이 파일과 같은 키 구조로 "덮어쓸 값만" 적어서 --config configs/exp/xxx.yaml 로 사용한다.

data:
  raw_path: "data/raw/reviews.csv"   # TODO: 실제 텍스트 데이터 경로로 교체
  text_column: "text"
  label_column: "label"
  test_ratio: 0.2
  seed: 42

preprocessing:
  lowercase: true
  remove_special_chars: true
  remove_stopwords: false
  min_token_len: 1
  max_len: 200          # 시퀀스 패딩/자르기 기준 길이

embedding:
  method: "word2vec"    # word2vec | fasttext | glove
  embedding_dim: 100
  window: 5
  min_count: 1
  freeze: false         # 임베딩 레이어를 학습 중 고정할지 여부
  glove_path: null      # method: glove 일 때 사전학습 벡터 파일 경로

model:
  type: "lstm"          # lstm | gru
  hidden_size: 128
  num_layers: 1
  bidirectional: false
  dropout: 0.3

train:
  batch_size: 64
  lr: 0.001
  epochs: 10
  seed: 42
